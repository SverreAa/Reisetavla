<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reisetavla · Kart</title>
<meta name="description" content="Kollektivtrafikken i Norge på kart i sanntid, med data fra Entur.">
<meta name="theme-color" content="#EDF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A111B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reisetavla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Overpass:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: kart i full skjerm, flytende toppstripe og bunnpanel som i Apple Kart */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F3F6FA; --ink:#0E1A2B; --muted:#5A6779; --line:#D7DEE8;
  --accent:#0B5FAD; --ok:#1C8448; --warn:#A9500C; --crit:#BF2A2A; --glass:rgba(255,255,255,.88);
  --shadow:0 1px 0 rgba(14,26,43,.06),0 10px 28px -14px rgba(14,26,43,.5);
  --m-bus:#C8352B; --m-coach:#7B3FA0; --m-rail:#1F5FAE; --m-metro:#D66A0D; --m-tram:#178454; --m-water:#0B8399; --m-air:#4E57C4;
  --f-display:"Overpass",ui-rounded,system-ui,-apple-system,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0A111B; --surface:#121C29; --surface-2:#1A2535; --ink:#E7EDF5; --muted:#94A2B4; --line:#263446;
  --accent:#5DA5EE; --ok:#4CC07E; --warn:#F09A4A; --crit:#F06B6B; --glass:rgba(18,28,41,.88);
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.9);
  --m-bus:#E4625A; --m-coach:#B07ACF; --m-rail:#5C93DB; --m-metro:#EE9246; --m-tram:#3CB27C; --m-water:#38B3C8; --m-air:#8A91E8;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button,a{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
@media (prefers-color-scheme: dark){.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.6)}}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-control-zoom{display:none}

/* Toppstripe */
.top{position:fixed;z-index:1000;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);text-decoration:none;flex:none}
.title{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:6px 14px 6px 14px;height:44px;box-shadow:var(--shadow);min-width:0;flex:1}
.title b{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap}
.title b span{color:var(--accent)}
.stat{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.stat.live i{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}

/* Høyre knapper */
.side{position:fixed;z-index:1000;right:12px;top:calc(66px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px}

/* Bunnpanel */
.panel{position:fixed;z-index:1000;left:0;right:0;bottom:0;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center}
.panel>*{pointer-events:auto;width:100%;max-width:560px}
.sheet{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;box-shadow:var(--shadow);padding:10px 0 12px;display:grid;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:7px 11px 7px 9px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted);font-size:14px;font-weight:700}
.chip svg{width:17px;height:17px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--mc);color:var(--ink);background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.chip[aria-pressed="true"] svg{color:var(--mc)}
.legend{display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend .k{display:inline-flex;align-items:center;gap:6px}
.dotl{width:12px;height:12px;border-radius:50%;background:var(--ink)}
.doth{width:12px;height:12px;border-radius:50%;border:2px dashed var(--ink);opacity:.8}
.switch{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink)}
.switch .tr{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-pressed="true"] .tr{background:var(--ok)}
.switch[aria-pressed="true"] .tr::after{transform:translateX(16px)}
.hint{font-size:13px;color:var(--muted);padding:0 14px}

/* Kjøretøykort */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px;display:grid;gap:8px}
.card .h{display:flex;align-items:center;gap:10px}
.card .h b{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.2;min-width:0}
.card .x{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.card .row{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.card .row strong{color:var(--ink);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.gps{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.ok{color:var(--ok)!important} .warn{color:var(--warn)!important}
.lp{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;background:var(--mc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;line-height:1.2;flex:none}
.lp svg{width:16px;height:16px;stroke-width:2}

/* Markører */
.vm{background:none;border:0}
.veh{position:relative;display:flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:11px;background:var(--mc);color:#fff;font:800 12px/1 var(--f-display);font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface),0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);white-space:nowrap}
.veh.est{background:var(--surface);color:var(--mc);box-shadow:0 0 0 2px var(--mc) inset,0 2px 6px rgba(0,0,0,.25);border:0;outline:2px dashed color-mix(in srgb,var(--mc) 55%,transparent);outline-offset:1px}
.veh .dir{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--b,0deg))}
.veh .dir::before{content:"";position:absolute;left:-5px;top:-21px;border:5px solid transparent;border-top:0;border-bottom:7px solid var(--mc)}
.veh.dot{min-width:11px;width:11px;height:11px;padding:0;border-radius:50%;font-size:0}
.veh.dot .dir{display:none}
.veh.sel{box-shadow:0 0 0 3px var(--ink),0 2px 10px rgba(0,0,0,.45);z-index:2}
.me{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px #fff,0 0 0 9px color-mix(in srgb,var(--accent) 25%,transparent);transform:translate(-50%,-50%)}

.toast{position:fixed;z-index:1100;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Kart over kjøretøy"></div>

<div class="top">
  <a class="round" href="./" aria-label="Tilbake til reisesøk"><svg class="i" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6"/></svg></a>
  <div class="title"><b>Reise<span>kart</span></b><div class="stat" id="stat"><i></i><span>Kobler til</span></div></div>
</div>

<div class="side">
  <button class="round" id="locate" aria-label="Vis min posisjon"><svg class="i" viewBox="0 0 20 20"><path d="M17.5 2.5 2.5 9l6.5 2.5L11.5 18z"/></svg></button>
  <button class="round" id="share" aria-label="Del kartutsnittet"><svg class="i" viewBox="0 0 20 20"><path d="M10 13V2.5M6.5 6 10 2.5 13.5 6M6 9H4.5v8.5h11V9H14"/></svg></button>
</div>

<div class="panel">
  <div class="card" id="card" hidden></div>
  <div class="sheet">
    <div class="chips" id="chips" role="group" aria-label="Transportmidler"></div>
    <div class="legend">
      <span class="k"><span class="dotl"></span>GPS</span>
      <span class="k"><span class="doth"></span>Beregnet</span>
      <button class="switch" id="estBtn" aria-pressed="true"><span>Beregnede</span><span class="tr"></span></button>
    </div>
    <div class="hint" id="hint" hidden></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
const CLIENT='sverre-reisetavla';
const VEH='https://api.entur.io/realtime/v2/vehicles/graphql';
const JP='https://api.entur.io/journey-planner/v3/graphql';
const LIVE_MS=8000, EST_MS=30000, EST_MIN_ZOOM=13, LABEL_ZOOM=12;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MODES=[['bus','Buss'],['coach','Ekspressbuss'],['rail','Tog'],['metro','T-bane'],['tram','Trikk'],['water','Båt']];
const LABEL=Object.fromEntries(MODES);
const ICON={
  bus:'<path d="M5 3.5h10a2 2 0 0 1 2 2V14H3V5.5a2 2 0 0 1 2-2z"/><path d="M3 9.5h14M3 6.5h14"/><circle cx="6.5" cy="15.8" r="1.2"/><circle cx="13.5" cy="15.8" r="1.2"/>',
  coach:'<path d="M2 5.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2V14H2z"/><path d="M2 9h16M7 3.5V9M12 3.5V9"/><circle cx="5.5" cy="15.8" r="1.2"/><circle cx="14.5" cy="15.8" r="1.2"/>',
  rail:'<rect x="5" y="2.5" width="10" height="12" rx="3"/><path d="M5 9h10"/><path d="M8 12h.01M12 12h.01"/><path d="M7 14.5 5 18M13 14.5l2 3.5"/>',
  tram:'<path d="M7 2h6M10 2v3"/><rect x="5" y="5" width="10" height="10" rx="2.5"/><path d="M5 10h10M7 15l-2 3M13 15l2 3"/>',
  metro:'<circle cx="10" cy="10" r="7.5"/><path d="M6.5 6.5h7M10 6.5v8"/>',
  water:'<path d="M3 11h14l-2.2 4H5.2z"/><path d="M6 11V7.5h6l2 3.5M9 7.5V4.5"/><path d="M2 18.2c1.5 0 1.5-1 3-1s1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1"/>'
};
const ic=k=>`<svg class="i" viewBox="0 0 20 20" aria-hidden="true">${ICON[k]||ICON.bus}</svg>`;
const normMode=m=>{m=String(m||'').toLowerCase(); return m==='ferry'?'water':(LABEL[m]?m:'bus');};
const OPS={VYG:'Vy',VYB:'Vy Buss',VYX:'Vy Express',FLT:'Flytoget',SJN:'SJ Nord',GOA:'Go-Ahead',RUT:'Ruter',ATB:'AtB',SKY:'Skyss',KOL:'Kolumbus',AKT:'AKT',TRO:'Troms fylkestrafikk',NOR:'Reis Nordland',MOR:'FRAM',INN:'Innlandstrafikk',BRA:'Brakar',OST:'Østfold kollektivtrafikk',VOT:'Farte',FIN:'Snelandia',NBU:'Norgesbuss',FLI:'Flybussen',BFO:'Bane NOR / båt',TEL:'Farte'};

/* ---------- Innstillinger ---------- */
function load(k,d){try{const v=JSON.parse(localStorage.getItem('reisekart.'+k));return v??d;}catch{return d;}}
function save(k,v){try{localStorage.setItem('reisekart.'+k,JSON.stringify(v));}catch{}}
const modes=new Set(load('modes',MODES.map(m=>m[0])));
let showEst=load('est',true);

/* ---------- Kart ---------- */
const qs=new URLSearchParams(location.search);
const start=qs.get('lat')&&qs.get('lon')?[+qs.get('lat'),+qs.get('lon')]:load('center',[59.9127,10.7461]);
const startZ=qs.get('z')?+qs.get('z'):load('zoom',13);
const map=L.map('map',{zoomControl:false,attributionControl:true,maxZoom:18}).setView(start,startZ);
const dark=matchMedia('(prefers-color-scheme: dark)');
// Kartverket: åpne, gratis kartfliser for Norge (gråtone). Mørk modus inverteres med CSS.
L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png',{
  maxZoom:18, attribution:'© <a href="https://www.kartverket.no/">Kartverket</a> · Data: <a href="https://entur.no">Entur</a>'}).addTo(map);
map.attributionControl.setPrefix(false);

/* ---------- Markører ---------- */
const vehicles=new Map(); // key -> {marker, data, est, from, to, t0}
let selected=null;
function iconHtml(v,compact){
  const m=v.mode, cls=['veh',v.est?'est':'',compact?'dot':'',selected===v.key?'sel':''].join(' ');
  const dir=v.bearing!=null&&!compact?`<i class="dir" style="--b:${Math.round(v.bearing)}deg"></i>`:'';
  return `<div class="${cls}" style="--mc:var(--m-${m})">${dir}${esc(v.code||'')}</div>`;
}
function makeIcon(v){
  const compact=map.getZoom()<LABEL_ZOOM;
  return L.divIcon({className:'vm',html:iconHtml(v,compact),iconSize:[0,0]});
}
function sig(v){return [v.mode,v.code,v.est,map.getZoom()<LABEL_ZOOM,selected===v.key, v.bearing!=null?Math.round(v.bearing/10):'-'].join('|');}
function upsert(v){
  let e=vehicles.get(v.key);
  const ll=L.latLng(v.lat,v.lon);
  if(!e){
    const marker=L.marker(ll,{icon:makeIcon(v),keyboard:false,riseOnHover:true});
    marker.on('click',ev=>{L.DomEvent.stopPropagation(ev);select(v.key);});
    marker.addTo(map);
    e={marker,data:v,sig:sig(v),from:ll,to:ll,t0:0};
    vehicles.set(v.key,e);
  }else{
    e.data=v;
    const s=sig(v); if(s!==e.sig){e.marker.setIcon(makeIcon(v));e.sig=s;}
    const cur=e.marker.getLatLng();
    if(v.est){ e.marker.setLatLng(ll); e.from=e.to=ll; }
    else if(cur.distanceTo(ll)>2){ e.from=cur; e.to=ll; e.t0=performance.now(); animating=true; }
  }
  e.seen=true;
}
let animating=false;
function frame(now){
  if(animating){
    animating=false;
    for(const e of vehicles.values()){
      if(!e.t0) continue;
      const k=Math.min(1,(now-e.t0)/1500), f=k<1?k*(2-k):1;
      e.marker.setLatLng([e.from.lat+(e.to.lat-e.from.lat)*f, e.from.lng+(e.to.lng-e.from.lng)*f]);
      if(k<1) animating=true; else e.t0=0;
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function sweep(isEst){
  for(const [k,e] of vehicles){
    if(!!e.data.est!==isEst) continue;
    if(!e.seen || !modes.has(e.data.mode) || (isEst&&!showEst)){ map.removeLayer(e.marker); vehicles.delete(k); if(selected===k) closeCard(); }
    else e.seen=false;
  }
}
function refreshIcons(){ for(const e of vehicles.values()){ const s=sig(e.data); if(s!==e.sig){e.marker.setIcon(makeIcon(e.data));e.sig=s;} } }

/* ---------- Sanntid (GPS) fra Entur ---------- */
const LIVE_Q=`query($b:BoundingBox){ vehicles(boundingBox:$b, maxDataAge:"PT3M"){ vehicleId mode codespace{codespaceId} line{publicCode lineName} destinationName operator{name} location{latitude longitude} bearing delay lastUpdated serviceJourney{id} } }`;
async function post(url,query,variables){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','ET-Client-Name':CLIENT},body:JSON.stringify({query,variables})});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); if(j.errors) throw new Error(j.errors[0].message); return j.data;
}
function bbox(pad=.25){const b=map.getBounds().pad(pad);return {minLat:b.getSouth(),minLon:b.getWest(),maxLat:b.getNorth(),maxLon:b.getEast()};}
let liveKeys=new Set(), liveCount=0, estCount=0, ok=false, lastErr=0;
async function pollLive(){
  if(document.hidden) return;
  try{
    const d=await post(VEH,LIVE_Q,{b:bbox()});
    const ks=new Set(); let n=0;
    for(const x of d.vehicles){
      if(!x.location) continue;
      const mode=normMode(x.mode), cs=x.codespace?.codespaceId||'';
      ks.add(cs+'|'+mode);
      if(!modes.has(mode)) continue;
      n++;
      upsert({key:'L:'+x.vehicleId, est:false, mode, cs, code:x.line?.publicCode, name:x.line?.lineName,
        dest:x.destinationName, op:x.operator?.name||OPS[cs]||cs, lat:x.location.latitude, lon:x.location.longitude,
        bearing:x.bearing, delay:x.delay, updated:x.lastUpdated, sj:x.serviceJourney?.id});
    }
    liveKeys=ks; liveCount=n; sweep(false); ok=true; status();
    if(selected) renderCard();
  }catch(e){ ok=false; status(); if(Date.now()-lastErr>60000){lastErr=Date.now();toast('Får ikke kontakt med Entur. Prøver igjen …');} }
}

/* ---------- Beregnede posisjoner (Ruter m.fl. som ikke sender GPS) ---------- */
const EST_Q=`query($s:DateTime,$a:Float!,$b:Float!,$c:Float!,$d:Float!){ stopPlacesByBbox(minimumLatitude:$a,minimumLongitude:$b,maximumLatitude:$c,maximumLongitude:$d){ latitude longitude
  estimatedCalls(startTime:$s,timeRange:1800,numberOfDepartures:40,whiteListedModes:[bus,tram,metro,water,rail]){ realtime aimedDepartureTime expectedArrivalTime expectedDepartureTime
   serviceJourney{ id line{ publicCode name transportMode authority{name} } } destinationDisplay{frontText} } } }`;
let journeys=new Map(); // sjId -> {mode,cs,code,name,op,dest,calls:[{lat,lon,arr,dep,aim,rt}]}
let estFetching=false;
async function pollEst(){
  if(document.hidden || !showEst) return;
  if(map.getZoom()<EST_MIN_ZOOM){ journeys=new Map(); hint(); sweep(true); estCount=0; status(); return; }
  if(estFetching) return; estFetching=true;
  try{
    const b=bbox(.15);
    const d=await post(JP,EST_Q,{s:new Date(Date.now()-15*60000).toISOString(),a:b.minLat,b:b.minLon,c:b.maxLat,d:b.maxLon});
    const js=new Map();
    for(const sp of d.stopPlacesByBbox||[]) for(const c of sp.estimatedCalls||[]){
      const id=c.serviceJourney?.id; if(!id) continue;
      let j=js.get(id);
      if(!j){
        const l=c.serviceJourney.line||{}, cs=id.split(':')[0];
        j={mode:normMode(l.transportMode),cs,code:l.publicCode,name:l.name,op:l.authority?.name||OPS[cs]||cs,dest:c.destinationDisplay?.frontText,calls:[]};
        js.set(id,j);
      }
      j.calls.push({lat:sp.latitude,lon:sp.longitude,arr:+new Date(c.expectedArrivalTime||c.expectedDepartureTime),dep:+new Date(c.expectedDepartureTime),aim:+new Date(c.aimedDepartureTime),rt:c.realtime});
    }
    for(const j of js.values()) j.calls.sort((a,b)=>a.dep-b.dep);
    journeys=js; tickEst();
  }catch(e){ /* stille: GPS-laget fortsetter */ }
  finally{ estFetching=false; hint(); }
}
function tickEst(){
  if(!showEst || map.getZoom()<EST_MIN_ZOOM) return;
  const now=Date.now(); let n=0;
  for(const [id,j] of journeys){
    if(!modes.has(j.mode)) continue;
    if(liveKeys.has(j.cs+'|'+j.mode)) continue; // operatøren sender GPS her – bruk den
    if(!j.calls.some(c=>c.rt)) continue;
    let prev=null,next=null;
    for(const c of j.calls){ if(c.dep<=now) prev=c; else if(c.arr>now){ next=c; break; } else { prev=c; } }
    // står ved stopp (ankommet, ikke gått)
    const at=j.calls.find(c=>c.arr<=now&&c.dep>now);
    let lat,lon,bearing=null;
    if(at){ lat=at.lat; lon=at.lon; }
    else if(prev&&next){
      const span=next.arr-prev.dep; if(span<=0||span>15*60000) continue;
      const f=Math.min(1,Math.max(0,(now-prev.dep)/span));
      lat=prev.lat+(next.lat-prev.lat)*f; lon=prev.lon+(next.lon-prev.lon)*f;
      bearing=brg(prev,next);
    } else continue;
    const ref=next||at;
    n++;
    upsert({key:'E:'+id,est:true,mode:j.mode,cs:j.cs,code:j.code,name:j.name,dest:j.dest,op:j.op,lat,lon,bearing,
      delay:ref?Math.round((ref.dep-ref.aim)/1000):null, updated:null, sj:id});
  }
  estCount=n; sweep(true); status();
  if(selected?.startsWith('E:')) renderCard();
}
function brg(a,b){const t=Math.PI/180,y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t),x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);return (Math.atan2(y,x)/t+360)%360;}

/* ---------- Kjøretøykort ---------- */
function select(k){ const prev=selected; selected=k; for(const key of [prev,k]){const e=vehicles.get(key); if(e){e.sig='';e.marker.setIcon(makeIcon(e.data));}} renderCard(); }
function closeCard(){ const e=vehicles.get(selected); selected=null; if(e){e.sig='';e.marker.setIcon(makeIcon(e.data));} $('#card').hidden=true; }
function renderCard(){
  const e=vehicles.get(selected); if(!e){ $('#card').hidden=true; return; }
  const v=e.data, d=v.delay;
  const dl = d==null?'' : Math.abs(d)<60?'<strong class="ok">I rute</strong>' : d>0?`<strong class="warn">${Math.round(d/60)} min forsinket</strong>`:`<strong>${Math.round(-d/60)} min før tiden</strong>`;
  const age = v.updated?Math.max(0,Math.round((Date.now()-new Date(v.updated))/1000)):null;
  $('#card').innerHTML=`<div class="h"><span class="lp" style="--mc:var(--m-${v.mode})">${ic(v.mode)}${esc(v.code||LABEL[v.mode])}</span>
     <b>${v.dest?'mot '+esc(v.dest):esc(v.name||LABEL[v.mode])}</b>
     <button class="x" id="cardX" aria-label="Lukk"><svg class="i" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></svg></button></div>
   <div class="row">${dl}<span>${esc(LABEL[v.mode])} · ${esc(v.op||'')}</span></div>
   <div class="row">${v.est?'<span class="tag">Beregnet</span><span>Posisjon regnet ut fra sanntidstider ved stoppene</span>':`<span class="tag gps">GPS</span><span>${age!=null?`Oppdatert for ${age<60?age+' s':Math.round(age/60)+' min'} siden`:''}</span>`}</div>`;
  $('#card').hidden=false; $('#cardX').onclick=closeCard;
}
map.on('click',closeCard);

/* ---------- Status, filter, hint ---------- */
function status(){
  const s=$('#stat'); s.classList.toggle('live',ok);
  s.querySelector('span').textContent= ok ? `${liveCount} GPS${showEst&&map.getZoom()>=EST_MIN_ZOOM?` · ${estCount} beregnet`:''}` : 'Kobler til';
}
function hint(){
  const h=$('#hint');
  if(showEst && map.getZoom()<EST_MIN_ZOOM){ h.textContent='Zoom inn for å se beregnede posisjoner for trikk, T-bane og Ruter-busser.'; h.hidden=false; }
  else h.hidden=true;
}
$('#chips').innerHTML=MODES.map(([k,l])=>`<button class="chip" data-m="${k}" style="--mc:var(--m-${k})" aria-pressed="${modes.has(k)}">${ic(k)}${l}</button>`).join('');
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const m=b.dataset.m; modes.has(m)?modes.delete(m):modes.add(m); b.setAttribute('aria-pressed',modes.has(m)); save('modes',[...modes]);
  for(const e of vehicles.values()) e.seen=modes.has(e.data.mode);
  sweep(false); sweep(true); pollLive(); tickEst();
});
const estBtn=$('#estBtn'); estBtn.setAttribute('aria-pressed',showEst);
estBtn.onclick=()=>{ showEst=!showEst; estBtn.setAttribute('aria-pressed',showEst); save('est',showEst); if(!showEst){ journeys=new Map(); sweep(true); estCount=0; } else pollEst(); hint(); status(); };

let mt;
map.on('moveend',()=>{
  save('center',[map.getCenter().lat,map.getCenter().lng]); save('zoom',map.getZoom());
  const c=map.getCenter(); history.replaceState(null,'',`?lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&z=${map.getZoom()}`);
  refreshIcons(); hint(); status();
  clearTimeout(mt); mt=setTimeout(()=>{pollLive();pollEst();},250);
});

/* ---------- Posisjon og deling ---------- */
let meMarker=null;
$('#locate').onclick=()=>{
  if(!navigator.geolocation){toast('Posisjon er ikke tilgjengelig');return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(!meMarker) meMarker=L.marker(ll,{icon:L.divIcon({className:'vm',html:'<div class="me"></div>',iconSize:[0,0]}),interactive:false}).addTo(map);
    else meMarker.setLatLng(ll);
    map.setView(ll,Math.max(map.getZoom(),15));
  },()=>toast('Fikk ikke tilgang til posisjonen din'),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
};
$('#share').onclick=async()=>{
  const url=location.href;
  if(navigator.share){ try{ await navigator.share({title:'Reisekart',url}); }catch{} return; }
  try{ await navigator.clipboard.writeText(url); toast('Lenken er kopiert'); }catch{ toast(url); }
};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200);}

/* ---------- Løkker ---------- */
pollLive(); pollEst(); hint();
setInterval(pollLive,LIVE_MS);
setInterval(pollEst,EST_MS);
setInterval(tickEst,1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ pollLive(); pollEst(); } });
})();
</script>
</body>
</html>
