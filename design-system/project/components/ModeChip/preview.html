<html lang="no">
<head><meta charset="utf-8"><title>ModeChip</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink)}#root{padding:16px;display:grid;gap:12px;align-content:start}</style>
</head>
<body>
<div id="root" class="rt-root"></div>

var R = window.Reisetavla, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } }, ['bus','rail','metro','tram','water','coach','air'].map(function (m, i) { return h(R.ModeChip, { key: m, mode: m, pressed: i !== 4 }); })));
