<!doctype html>
<html lang="no">
<head><meta charset="utf-8"><title>Icon</title>
<style>html,body{margin:0}body{background:var(--bg);color:var(--ink)}#root{padding:16px;display:grid;gap:12px;align-content:start}</style>
</head>
<body>
<div id="root" class="rt-root"></div>
<script>
var R = window.Reisetavla, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { display: 'flex', gap: 14, flexWrap: 'wrap', color: 'var(--ink)' } }, ['bus','coach','rail','metro','tram','water','air','foot','pin','me','warn','star','share','swap','close','board'].map(function (n) { return h(R.Icon, { key: n, name: n }); })));
</script>
</body>
